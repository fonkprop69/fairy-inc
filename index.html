<style>
  :root{
    --ink:#221d17;
    --ink-soft:#4a4238;
    --parchment:#f7f2e7;
    --card-bg:rgba(247,242,231,0.55);
    --hairline:rgba(34,29,23,0.22);
    --gold:#9c7a3c;
    --gold-deep:#6b4f22;
    --scrim-top:rgba(18,14,10,0.10);
    --scrim-bottom:rgba(18,14,10,0.58);
  }

  /* Fairy Potion is a fixed monochrome + antique-gold brand identity,
     so its palette intentionally stays the same under the viewer's
     light/dark preference rather than switching to a different scheme. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#221d17;
      --ink-soft:#4a4238;
      --parchment:#f7f2e7;
      --card-bg:rgba(247,242,231,0.55);
      --hairline:rgba(34,29,23,0.22);
      --gold:#9c7a3c;
      --gold-deep:#6b4f22;
      --scrim-top:rgba(18,14,10,0.10);
      --scrim-bottom:rgba(18,14,10,0.58);
    }
  }
  :root[data-theme="dark"]{
    --ink:#221d17;
    --ink-soft:#4a4238;
    --parchment:#f7f2e7;
    --card-bg:rgba(247,242,231,0.55);
    --hairline:rgba(34,29,23,0.22);
    --gold:#9c7a3c;
    --gold-deep:#6b4f22;
    --scrim-top:rgba(18,14,10,0.10);
    --scrim-bottom:rgba(18,14,10,0.58);
  }
